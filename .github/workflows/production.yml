name: Production

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after verification (defaults to a safe dry run)
        required: true
        type: boolean
        default: false
      reason:
        description: Reason for this production verification or deployment
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require the exact protected main revision
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"

      - name: Check offline invariants
        run: make check

      - name: Verify exact public compatibility
        run: make verify

  deploy:
    name: Deploy
    if: ${{ inputs.deploy }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
      url: https://truco.baixada.cards
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ secrets.BAIXADA_GCP_PROJECT_ID }}
      GCP_REGION: us-west1
      GCP_ARTIFACT_REPOSITORY: containers
      SERVER_SERVICE: truco-server
      WEB_SERVICE: truco-web

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require passing CI for the exact main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          deploy_sha="$(git rev-parse HEAD)"
          test "$deploy_sha" = "$(git rev-parse origin/main)"
          test "$GITHUB_SHA" = "$deploy_sha"
          conclusion="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --commit "$deploy_sha" \
              --branch main \
              --event push \
              --limit 10 \
              --json conclusion,createdAt \
              --jq 'sort_by(.createdAt) | last | .conclusion'
          )"
          test "$conclusion" = success
          echo "DEPLOY_SHA=$deploy_sha" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.12.0

      - name: Install Socket Firewall
        env:
          SFW_SHA256: 4dc46b626a7c5b81c0b54e1984ee53be5a628dbfb2f55ab14e9b04c8a134db6a
          SFW_URL: https://github.com/SocketDev/sfw-free/releases/download/v1.13.1/sfw-free-linux-x86_64
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "$SFW_URL" \
            --output "$RUNNER_TEMP/sfw"
          echo "$SFW_SHA256  $RUNNER_TEMP/sfw" | sha256sum --check -
          install -m 0755 "$RUNNER_TEMP/sfw" "$RUNNER_TEMP/bin/sfw"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install pnpm
        run: sfw npm install --global pnpm@10.26.2

      - name: Materialize exact deployable components
        run: |
          python3 scripts/materialize.py --component server --refresh
          python3 scripts/materialize.py --component web --refresh
          sfw pnpm --dir .components/web install --frozen-lockfile

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.BAIXADA_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.BAIXADA_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.BAIXADA_GCP_PROJECT_ID }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 575.0.1

      - name: Materialize and verify licensed runtime audio
        env:
          BAIXADA_PRIVATE_AUDIO_GCS_URI: ${{ secrets.BAIXADA_PRIVATE_AUDIO_GCS_URI }}
        run: |
          pnpm --dir .components/web audio:sync-private
          pnpm --dir .components/web audio:verify-private

      - name: Build and push immutable images
        run: |
          set -euo pipefail
          registry="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}"
          server_revision="$(jq -r '.components.server.revision' stack.lock.json)"
          web_revision="$(jq -r '.components.web.revision' stack.lock.json)"
          server_tag="${registry}/${SERVER_SERVICE}:${server_revision}"
          web_tag="${registry}/${WEB_SERVICE}:${web_revision}"

          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --tag "$server_tag" \
            .components/server
          docker buildx build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_SHOW_DEV_CONTROLS=false \
            --build-arg NEXT_PUBLIC_STUDY_LAB_LINKS=false \
            --build-arg NEXT_PUBLIC_STUDY_MANIFEST_URL=https://storage.googleapis.com/truco-study-artifacts/releases/20260717-full-225-v1/manifest.json \
            --push \
            --tag "$web_tag" \
            .components/web

          server_digest="$(
            gcloud artifacts docker images describe "$server_tag" \
              --format='value(image_summary.digest)'
          )"
          web_digest="$(
            gcloud artifacts docker images describe "$web_tag" \
              --format='value(image_summary.digest)'
          )"
          test -n "$server_digest"
          test -n "$web_digest"
          echo "SERVER_IMAGE=${registry}/${SERVER_SERVICE}@${server_digest}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=${registry}/${WEB_SERVICE}@${web_digest}" >> "$GITHUB_ENV"

      - name: Deploy, smoke-test, and roll back on failure
        run: |
          set -euo pipefail

          current_revision() {
            gcloud run services describe "$1" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --format=json 2>/dev/null |
              jq -r '[.status.traffic[]? | select(.percent == 100)][0].revisionName // empty' ||
              true
          }

          previous_server="$(current_revision "$SERVER_SERVICE")"
          previous_web="$(current_revision "$WEB_SERVICE")"

          rollback() {
            exit_code=$?
            trap - ERR
            if [ -n "$previous_web" ]; then
              gcloud run services update-traffic "$WEB_SERVICE" \
                --project "$GCP_PROJECT_ID" \
                --region "$GCP_REGION" \
                --to-revisions="${previous_web}=100" \
                --quiet || true
            fi
            if [ -n "$previous_server" ]; then
              gcloud run services update-traffic "$SERVER_SERVICE" \
                --project "$GCP_PROJECT_ID" \
                --region "$GCP_REGION" \
                --to-revisions="${previous_server}=100" \
                --quiet || true
            fi
            exit "$exit_code"
          }
          trap rollback ERR

          gcloud run deploy "$SERVER_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$SERVER_IMAGE" \
            --service-account "truco-server-runtime@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --execution-environment gen1 \
            --cpu 0.25 \
            --memory 512Mi \
            --concurrency 1 \
            --cpu-throttling \
            --no-cpu-boost \
            --min 0 \
            --max 1 \
            --min-instances 0 \
            --max-instances 1 \
            --timeout 30s \
            --port 8080 \
            --ingress all \
            --no-session-affinity \
            --no-allow-unauthenticated \
            --set-secrets OPENROUTER_API_KEY=truco-openrouter-api-key:latest \
            --set-env-vars "NODE_ENV=production,TRUCO_SESSION_IDLE_TTL_SECONDS=1800,TRUCO_SESSION_MAX_ACTIVE_PER_SUBJECT=5,TRUCO_SESSION_CREATE_RATE_LIMIT_WINDOW_SECONDS=300,TRUCO_SESSION_CREATE_RATE_LIMIT_MAX=10,TRUCO_OPENROUTER_MODEL=google/gemini-3.1-flash-lite,TRUCO_OPENROUTER_REFERER=https://truco.baixada.cards,TRUCO_OPENROUTER_TITLE=Baixada Truco" \
            --labels "baixada-component=truco-server,baixada-stack=${DEPLOY_SHA}" \
            --quiet

          server_url="$(
            gcloud run services describe "$SERVER_SERVICE" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --format='value(status.url)'
          )"
          test -n "$server_url"

          gcloud run services add-iam-policy-binding "$SERVER_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --member "serviceAccount:truco-web-runtime@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --role roles/run.invoker \
            --quiet

          gcloud run deploy "$WEB_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$WEB_IMAGE" \
            --service-account "truco-web-runtime@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --execution-environment gen1 \
            --cpu 0.5 \
            --memory 512Mi \
            --concurrency 1 \
            --cpu-throttling \
            --no-cpu-boost \
            --min 0 \
            --max 1 \
            --min-instances 0 \
            --max-instances 1 \
            --timeout 60s \
            --port 8080 \
            --ingress all \
            --no-session-affinity \
            --allow-unauthenticated \
            --set-secrets TRUCO_ANON_COOKIE_SECRET=truco-anonymous-cookie-secret:latest \
            --set-env-vars "NODE_ENV=production,TRUCO_ENGINE_SERVICE_URL=${server_url},TRUCO_ENGINE_SERVICE_AUDIENCE=${server_url},STUDY_LAB_MODE=stealth,STUDY_MANIFEST_URL=https://storage.googleapis.com/truco-study-artifacts/releases/20260717-full-225-v1/manifest.json" \
            --labels "baixada-component=truco-web,baixada-stack=${DEPLOY_SHA}" \
            --quiet

          web_url="$(
            gcloud run services describe "$WEB_SERVICE" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --format='value(status.url)'
          )"
          test -n "$web_url"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location "${web_url}/en" >/dev/null; then
              break
            fi
            test "$attempt" -lt 30
            sleep 2
          done

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --cookie-jar "$RUNNER_TEMP/smoke.cookies" \
              --header 'content-type: application/json' \
              --data '{"humanPlayer":0,"startingDealer":0,"botKind":"random","seed":20260724}' \
              --output "$RUNNER_TEMP/smoke-match.json" \
              "${web_url}/api/game/session" &&
              jq -e '.matchId | strings' "$RUNNER_TEMP/smoke-match.json" >/dev/null
            then
              break
            fi
            test "$attempt" -lt 30
            sleep 2
          done

          for audio in \
            card-hide-flip-pse-bw-bd3-ucotv.m4a \
            raise-decline-card-stack-pse-bw-bd3hl-dgbny.m4a \
            raise-table-slap-firm-pse-of-g9loz.m4a \
            raise-wood-table-hard-pse-kcv3-sjun9.m4a \
            reraise-lamp-creak-pse-gen-ys39g.m4a
          do
            curl --fail --silent --show-error \
              "${web_url}/audio/farol/${audio}" >/dev/null
          done

          trap - ERR
          {
            echo "### Cloud Run production deployment"
            echo
            echo "- Stack: \`${DEPLOY_SHA}\`"
            echo "- Server image: \`${SERVER_IMAGE}\`"
            echo "- Web image: \`${WEB_IMAGE}\`"
            echo "- Web service: ${web_url}"
            echo "- Smoke test: page, real match creation, and five licensed cues passed"
          } >> "$GITHUB_STEP_SUMMARY"
